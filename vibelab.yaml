app:
  id: "7703608857427329039"
  name: "TrashDash-Spatial"
  slogan: "看向跑道，捏一下短跳，捏住高跳。"
  description: |
    TrashDash 垃圾跑酷·空间版是一款面向 PICO Spatial 的休闲跑酷游戏。
    跟随小猫穿过街道，越过高低路障、收集鱼骨，连续过栏可将技巧加分提高到四倍。
    游戏以 Shared Space 立体窗口呈现。看向跑道，捏一下短跳，捏住高跳。保留角色、配饰、道具、任务、商店与本地进度。
    本版本为开发预览。
  tags: [ "跑酷", "休闲", "空间游戏" ]
  category: game
  icon: vibelab-assets/icon.png
  landscape: vibelab-assets/landscape.png
  detail_images:
    - vibelab-assets/detail-gameplay.png
    - vibelab-assets/detail-shop.png
    - vibelab-assets/detail-menu.png
  videos: []
version:
  name: "1.3"
  notes: |
    更新单跑道玩法和中文手势提示。短捏过低栏得分更高，捏住可跳过高栏。
    修复真机跑局和结算文字被背景遮挡的问题，已复测窗口静置时的显示。
    现有封面和详情图为早期开发预览。

build:
  repo_url: "https://github.com/yangel-yan/TrashDash-Spatial"
  repo_visibility: public
  tech_stack: unity
  ai_tool: Trae CLI
  ai_model: GPT-6
  features:
    - hand_tracking
  teammates: []
